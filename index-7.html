<style>
:root{--bg:#06111f;--panel:#0b1d33;--panel2:#102742;--line:rgba(255,255,255,.09);--text:#f1f7ff;--muted:#91a8c0;--cyan:#29d3ee;--blue:#2d6cff;--gold:#f3c861;--danger:#ff7272;--ok:#42d6a0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 90% 0,#163a66 0,#071426 35%,#040b14 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto}.top{position:sticky;top:0;z-index:30;background:rgba(4,11,20,.86);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:.4px}.logo b{color:var(--cyan)}.topright{display:flex;gap:8px;align-items:center}.round{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:#102641;color:#fff}.main{padding:20px 16px 100px}.hero{border:1px solid rgba(41,211,238,.16);border-radius:26px;padding:22px;background:linear-gradient(135deg,rgba(18,57,99,.9),rgba(8,24,44,.8));box-shadow:0 20px 55px rgba(0,0,0,.25)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--cyan);text-transform:uppercase}.hero h1{font-size:28px;margin:8px 0}.hero p{color:#b5c9dd;margin:0 0 17px;line-height:1.55}.xpRow{display:flex;align-items:center;gap:14px}.level{font-size:12px;color:var(--gold);font-weight:900}.bar{height:8px;background:#17304e;border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:15px}.card{background:rgba(11,29,51,.86);border:1px solid var(--line);border-radius:20px;padding:16px}.stat{font-size:27px;font-weight:900;margin-top:5px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.section{margin-top:24px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.sectionHead h2{font-size:19px;margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tag{display:inline-block;border:1px solid rgba(41,211,238,.18);background:rgba(41,211,238,.08);color:#8beeff;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800;margin-bottom:10px}.btn{border:1px solid var(--line);background:#102844;color:#fff;border-radius:12px;padding:10px 13px}.btn.primary{border:0;background:linear-gradient(90deg,#2865ed,#11a9df);font-weight:800}.btn.danger{background:rgba(255,114,114,.09);color:#ff9a9a}.btn.small{padding:7px 10px;font-size:12px}.bottom{position:fixed;z-index:40;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(4,11,20,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px}.nav{min-width:64px;border:0;background:transparent;color:#7990aa;border-radius:13px;padding:7px 8px;font-size:10px}.nav.active{background:#102b4a;color:#fff}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginBox{width:min(430px,100%);padding:27px;border-radius:28px;border:1px solid var(--line);background:rgba(10,27,48,.93);box-shadow:0 25px 80px rgba(0,0,0,.4)}.loginBox h1{font-size:30px;margin:8px 0}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#061425;color:#fff;border-radius:12px;padding:12px;outline:none}.field textarea{min-height:100px;resize:vertical}.status{min-height:18px;font-size:12px;color:#ffaaaa;margin-top:10px}.adminTitle{margin:6px 0 4px;font-size:25px}.tabs{display:flex;gap:7px;overflow:auto;padding:14px 0 4px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0c2038;color:#b8cbe0;border-radius:99px;padding:9px 12px;font-size:12px}.tab.active{background:#173a64;color:#fff;border-color:rgba(41,211,238,.2)}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:14px 0}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:620px;font-size:12px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:#91a8c0;font-weight:700;background:#0a1a2d}.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:none;align-items:flex-end;padding:0}.modal.show{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:#091a2d;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0;font-size:20px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.empty{padding:25px;text-align:center;color:var(--muted)}.adminOnly{display:none}@media(max-width:760px){.grid,.cards{grid-template-columns:1fr}.formGrid{grid-template-columns:1fr}.full{grid-column:auto}.main{padding-bottom:105px}.hideMobile{display:none}.table{min-width:580px}}

.builderBar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.builderCard{background:#1b252d;border:1px solid rgba(243,200,97,.15);border-radius:18px;padding:14px;margin-top:12px}.builderCard .field{margin:10px 0}.builderHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.builderLabel{font-size:10px;letter-spacing:1px;color:#f3a25d;font-weight:900;text-transform:uppercase}.iconBtns{display:flex;gap:5px}.iconBtn{width:34px;height:34px;border:1px solid var(--line);background:#102844;color:#fff;border-radius:10px}.optionRow{display:grid;grid-template-columns:28px 1fr 34px;gap:7px;align-items:center;margin-top:8px}.optionRow input{width:100%;border:1px solid var(--line);background:#071426;color:#fff;border-radius:10px;padding:10px}.radioPick{width:18px;height:18px;accent-color:#29d3ee}.builderHint{padding:10px 12px;border-radius:12px;background:rgba(41,211,238,.06);border:1px solid rgba(41,211,238,.12);color:#91a8c0;font-size:12px;margin-top:10px}.stickyActions{position:sticky;bottom:-1px;background:linear-gradient(180deg,rgba(9,26,45,0),#091a2d 28%);padding-top:18px}.builderCount{font-size:12px;color:#91a8c0}

.adminWelcome{padding:2px 4px 10px}.adminWelcome h2{font-size:25px;margin:3px 0 0}.adminStats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:4px}.miniStat{background:linear-gradient(135deg,#101f42,#0a1830);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:9px 10px;min-height:55px}.miniStat b{display:block;font-size:19px;line-height:1.05}.miniStat span{display:block;color:#91a8c0;font-size:9px;margin-top:4px}.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.quickBtn{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid rgba(255,255,255,.08);background:#101d3a;color:#fff;border-radius:13px;padding:10px;font-size:17px}.quickBtn span{flex:1}.quickBtn b,.quickBtn small{display:block}.quickBtn b{font-size:11px}.quickBtn small{font-size:8px;color:#91a8c0;margin-top:2px}.dashPanel{background:linear-gradient(135deg,#0d1c38,#09162b);border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:11px;margin-top:9px}.dashPanel h3{font-size:13px;margin:0 0 8px}.periodRow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;color:#91a8c0}.periodRow select{background:#071426;color:#fff;border:1px solid var(--line);border-radius:9px;padding:7px}.achievementGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.achievementGrid div{background:#101d3a;border-radius:10px;padding:8px}.achievementGrid b{display:block;font-size:13px}.achievementGrid small{color:#91a8c0;font-size:8px}.dashSearch{width:100%;margin-top:8px;background:#071426;border:1px solid var(--line);border-radius:10px;padding:9px;color:#fff}.wideAction{width:100%;border:0;background:linear-gradient(90deg,#ff7a45,#f43d78);color:#fff;font-weight:800;border-radius:11px;padding:11px}.backupGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.adminPageCompact{}
</style>
</head>
<body>
<div id="login" class="login">
<div class="loginBox">
<div class="eyebrow">SA LEARNING · JOURNEY WORLD</div>
<h1>Welcome back.</h1><p class="muted">Masuk ke platform learning baru.</p>
<div class="field"><label>Email</label><input id="email" type="email" placeholder="email"></div>
<div class="field"><label>Password</label><input id="password" type="password" placeholder="password"></div>
<button class="btn primary" style="width:100%" onclick="login()">Masuk ke Journey</button>
<div id="loginStatus" class="status"></div>
</div></div>

<div id="app" class="hidden">
<header class="top"><div class="logo">SA <b>LEARNING</b></div><div class="topright"><span id="rolePill" class="tag" style="margin:0"></span><button class="round" onclick="notifications()">🔔</button></div></header>
<main class="main wrap">
<div id="saPage">
<section class="hero"><div class="eyebrow">BASE CAMP</div><h1 id="welcome">Selamat datang 👋</h1><p>Setiap materi adalah langkah. Setiap pencapaian membawa kamu lebih jauh.</p><div class="xpRow"><div><div class="level" id="lvl">LEVEL 1</div><div class="muted" id="xp">0 XP</div></div><div class="bar"><i id="xpBar"></i></div></div></section>
<div class="grid"><div class="card"><div class="muted">JOURNEY</div><div class="stat" id="sJ">0</div></div><div class="card"><div class="muted">MATERIAL</div><div class="stat" id="sM">0</div></div><div class="card"><div class="muted">ACHIEVEMENT</div><div class="stat" id="sA">0</div></div></div>
<section class="section"><div class="sectionHead"><h2>Continue Your Journey</h2></div><div id="jCards" class="cards"></div></section>
<section class="section"><div class="sectionHead"><h2>Recommended Learning</h2></div><div id="mCards" class="cards"></div></section>
</div>

<div id="adminPage" class="adminOnly">
<div id="tabs" class="tabs compactTabs"></div><div id="adminContent"></div>
</div>
</main>
<nav class="bottom"><button class="nav active" onclick="home()">⌂<br>Home</button><button class="nav" onclick="toast('Learning detail segera tersedia')">▣<br>Learning</button><button class="nav" onclick="toast('Journey map segera tersedia')">◈<br>Journey</button><button class="nav" onclick="toast('Achievement segera tersedia')">★<br>Achievement</button><button class="nav" onclick="logout()">⇥<br>Keluar</button></nav>
</div>

<div id="modal" class="modal"><div class="sheet"><div class="sheetHead"><h2 id="modalTitle">Form</h2><button class="round" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" style="position:fixed;z-index:200;left:50%;bottom:85px;transform:translateX(-50%);background:#122b49;border:1px solid var(--line);padding:10px 14px;border-radius:12px;display:none;font-size:12px"></div>

<script>
const SUPABASE_URL='https://xbztlypsqasbtljtbaxe.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_r_yYey3QhcBPvkny4mb64Q_JlU3kErZ';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let me=null, adminTabName='dashboard';

const tabs=[
 ['dashboard','Dashboard'],['users','SA Management'],['materials','Materials'],['journeys','Journeys'],['quizzes','Quizzes'],['achievements','Achievements'],['notifications','Notifications']
];

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',2300)}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function login(){
 const st=document.getElementById('loginStatus');st.textContent='Memproses...';
 const {data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){st.textContent=error.message;return} await boot(data.user)
}
async function boot(auth){
 const {data,error}=await db.from('users').select('*').eq('auth_user_id',auth.id).maybeSingle();
 if(error||!data){document.getElementById('loginStatus').textContent='Login berhasil, tetapi profil public.users belum terhubung ke akun ini.';await db.auth.signOut();return}
 if(data.status!=='active'){document.getElementById('loginStatus').textContent='Akun sedang inactive.';await db.auth.signOut();return}
 me=data;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
 document.getElementById('rolePill').textContent=data.role.toUpperCase();
 document.getElementById('welcome').textContent='Selamat datang, '+(data.name||'SA').split(' ')[0]+' 👋';
 document.getElementById('lvl').textContent='LEVEL '+data.level;document.getElementById('xp').textContent=data.xp+' XP';document.getElementById('xpBar').style.width=(data.xp%100)+'%';
 const isAdmin=data.role==='admin';
 document.getElementById('saPage').style.display=isAdmin?'none':'block';
 document.getElementById('adminPage').style.display=isAdmin?'block':'none';
 document.querySelector('.bottom').style.display=isAdmin?'none':'flex';
 if(isAdmin){ renderTabs(); await adminTab('dashboard'); } else { await loadSA(); }
}
async function loadSA(){
 const [j,m,a]=await Promise.all([
  db.from('journeys').select('*').eq('status','published').order('created_at',{ascending:false}).limit(6),
  db.from('materials').select('*').eq('published',true).order('created_at',{ascending:false}).limit(6),
  db.from('achievements').select('*').eq('active',true).limit(30)
 ]);
 document.getElementById('sJ').textContent=j.data?.length||0;document.getElementById('sM').textContent=m.data?.length||0;document.getElementById('sA').textContent=a.data?.length||0;
 document.getElementById('jCards').innerHTML=(j.data||[]).map(x=>`<div class="card"><span class="tag">${esc(x.level||'JOURNEY')}</span><h3>${esc(x.name)}</h3><div class="muted">${esc(x.description||'Perjalanan baru menanti.')}</div><div class="muted" style="margin-top:12px">+${x.xp_reward||0} XP</div></div>`).join('')||'<div class="card empty">Belum ada journey yang dipublish.</div>';
 document.getElementById('mCards').innerHTML=(m.data||[]).map(x=>`<div class="card"><span class="tag">${esc(x.category||'LEARNING')}</span><h3>${esc(x.title)}</h3><div class="muted">${esc(x.description||'Materi pembelajaran.')}</div><div class="muted" style="margin-top:12px">${x.duration_minutes||0} menit · +${x.xp_reward||0} XP</div></div>`).join('')||'<div class="card empty">Belum ada materi yang dipublish.</div>';
}
function home(){if(me?.role==='admin'){document.getElementById('saPage').style.display='none';document.getElementById('adminPage').style.display='block';return}document.getElementById('saPage').style.display='block'}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${adminTabName===t[0]?'active':''}" onclick="adminTab('${t[0]}')">${t[1]}</button>`).join('')}
async function adminTab(tab){adminTabName=tab;renderTabs();const c=document.getElementById('adminContent');c.innerHTML='<div class="card">Memuat...</div>';({dashboard:adminDashboard,users:adminUsers,materials:adminMaterials,journeys:adminJourneys,quizzes:adminQuizzes,achievements:adminAchievements,notifications:adminNotifications}[tab])()}
async function count(table){const r=await db.from(table).select('*',{count:'exact',head:true});return r.count||0}
async function adminDashboard(){
 const [users,materials,journeys,quizzes,achievements,notifications]=await Promise.all(['users','materials','journeys','quizzes','achievements','notifications'].map(count));
 const [activeSA,publishedMaterials,publishedJourneys]=await Promise.all([
  db.from('users').select('id',{count:'exact',head:true}).eq('role','sa').eq('status','active'),
  db.from('materials').select('id',{count:'exact',head:true}).eq('published',true),
  db.from('journeys').select('id',{count:'exact',head:true}).eq('status','published')
 ]);
 const today=new Date(); today.setHours(0,0,0,0);
 const [loginToday,newSA]=await Promise.all([
  db.from('users').select('id',{count:'exact',head:true}).gte('last_login_at',today.toISOString()),
  db.from('users').select('id',{count:'exact',head:true}).gte('created_at',new Date(Date.now()-7*86400000).toISOString())
 ]);
 const completion=users?Math.min(100,Math.round((publishedMaterials.count||0)/(materials||1)*100)):0;
 document.getElementById('adminContent').innerHTML=`
 <div class="adminWelcome"><div class="muted">Good Evening, Admin 👋</div><h2>Pusat Kendali</h2></div>
 <div class="adminStats">
  <div class="miniStat"><b>${users}</b><span>Pengguna</span></div><div class="miniStat"><b>${activeSA.count||0}</b><span>Aktif</span></div>
  <div class="miniStat"><b>${publishedMaterials.count||0}</b><span>Sedang belajar</span></div><div class="miniStat"><b>${loginToday.count||0}</b><span>Login hari ini</span></div>
  <div class="miniStat"><b>${newSA.count||0}</b><span>Baru 7 hari</span></div><div class="miniStat"><b>${Math.max(0,users-(activeSA.count||0))}</b><span>Tidak aktif</span></div>
  <div class="miniStat"><b>${materials}</b><span>Materi</span></div><div class="miniStat"><b>${quizzes}</b><span>Kuis</span></div>
  <div class="miniStat"><b>${completion}%</b><span>Completion</span></div><div class="miniStat"><b>0%</b><span>Rata-rata nilai</span></div>
 </div>
 <div class="quickGrid">
  <button class="quickBtn" onclick="adminTab('materials')">✏️ <span><b>Edit Materi</b><small>Kelola materi & cover</small></span>↗</button>
  <button class="quickBtn" onclick="adminTab('quizzes')">📝 <span><b>Edit Kuis</b><small>Kelola soal & jawaban</small></span>↗</button>
  <button class="quickBtn" onclick="adminTab('journeys')">🗺️ <span><b>Journey</b><small>Atur perjalanan belajar</small></span>↗</button>
  <button class="quickBtn" onclick="adminTab('users')">👥 <span><b>Data SA</b><small>Kelola pengguna</small></span>↗</button>
 </div>
 <section class="dashPanel"><h3>Panel Pencapaian</h3><div class="periodRow"><span>Periode</span><select><option>${new Date().toLocaleDateString('id-ID')}</option></select></div><div class="achievementGrid"><div><b>${users}</b><small>Total SA</small></div><div><b>Rp0</b><small>Total target</small></div><div><b>Rp0</b><small>Total ACV / GMV</small></div><div><b>0%</b><small>Rata-rata Activity</small></div><div><b>0</b><small>SA capai target</small></div></div><input class="dashSearch" placeholder="Cari nama atau ID SA..." /></section>
 <section class="dashPanel"><h3>Performa Teratas</h3><div class="empty">Belum ada data pencapaian untuk periode ini.</div></section>
 <section class="dashPanel"><button class="wideAction" onclick="adminTab('users')">＋ Tambah SA Baru</button><div class="muted" style="margin-top:7px">Profil SA dapat dibuat dari sini. Akun login tetap dibuat melalui Supabase Authentication.</div></section>
 <section class="dashPanel"><h3>Keamanan & Data Admin</h3><div class="backupGrid"><button class="btn primary" onclick="toast('Fitur backup akan diaktifkan setelah storage data siap')">▣ Backup Data</button><button class="btn" onclick="toast('Pilih file backup untuk restore')">↥ Restore Data</button></div></section>
 <section class="dashPanel"><h3>Informasi Notifikasi</h3><div class="field"><label>Judul notifikasi</label><input placeholder="Judul notifikasi"></div><div class="field"><label>Pesan</label><textarea placeholder="Tulis pesan untuk SA..."></textarea></div><button class="btn primary" onclick="adminTab('notifications')">➤ Kelola & Kirim Notifikasi</button></section>`;
}

function toolbar(label,action){return `<div class="toolbar"><div><h2 style="margin:0">${label}</h2><div class="muted">Kelola dari Android</div></div><button class="btn primary" onclick="${action}">＋ Tambah</button></div>`}
function rows(data,cols,editFn,delFn){return `<div class="tableWrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>Aksi</th></tr></thead><tbody>${(data||[]).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[0]])}</td>`).join('')}<td><button class="btn small" onclick="${editFn}('${r.id}')">Edit</button> <button class="btn small danger" onclick="${delFn}('${r.id}')">Hapus</button></td></tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div>`}

function materialCoverUrl(path){if(!path)return '';return db.storage.from('material-covers').getPublicUrl(path).data.publicUrl}
function materialRows(data){return `<div class="tableWrap"><table class="table"><thead><tr><th>Cover</th><th>Title</th><th>Category</th><th>Level</th><th>Published</th><th>XP</th><th>Menit</th><th>Aksi</th></tr></thead><tbody>${(data||[]).map(r=>{const u=materialCoverUrl(r.cover_path);return `<tr><td>${u?`<img src="${u}" alt="cover" style="width:72px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`:'<span class="muted">Belum ada</span>'}</td><td>${esc(r.title)}</td><td>${esc(r.category)}</td><td>${esc(r.level)}</td><td>${r.published?'Yes':'No'}</td><td>${r.xp_reward||0}</td><td>${r.duration_minutes||0}</td><td><button class="btn small" onclick="editMaterial('${r.id}')">Edit</button> <button class="btn small danger" onclick="deleteMaterial('${r.id}')">Hapus</button></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Belum ada data.</td></tr>'}</tbody></table></div>`}
async function adminMaterials(){const {data,error}=await db.from('materials').select('*').order('created_at',{ascending:false});if(error){document.getElementById('adminContent').innerHTML='<div class="card">Gagal memuat Materials: '+esc(error.message)+'</div>';return}document.getElementById('adminContent').innerHTML=toolbar('Materials','materialForm()')+'<div class="card" style="margin-bottom:12px"><b>Cover Materi</b><div class="muted">Upload JPG/PNG/WebP. Gambar akan dikompres di perangkat dan disimpan di Supabase Storage, bukan sebagai Base64 di database.</div></div>'+materialRows(data)}
function materialForm(r={}){const u=materialCoverUrl(r.cover_path);openModal(r.id?'Edit Material':'Tambah Material',`<div class="formGrid">
<div class="field full"><label>Cover Materi <span class="muted">(maks. 1 MB sebelum kompresi)</span></label><input id="f_cover" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewCover(event)"><div id="coverPreview" style="margin-top:10px">${u?`<img src="${u}" style="width:100%;max-height:220px;object-fit:cover;border-radius:14px;border:1px solid var(--line)">`:'<div class="muted">Belum ada cover. Cover sebaiknya landscape 16:9.</div>'}</div></div>
<div class="field full"><label>Judul</label><input id="f_title" value="${esc(r.title)}"></div><div class="field"><label>Kategori</label><input id="f_category" value="${esc(r.category)}"></div><div class="field"><label>Level</label><input id="f_level" value="${esc(r.level)}" placeholder="Beginner"></div><div class="field"><label>Durasi (menit)</label><input id="f_duration" type="number" value="${r.duration_minutes||0}"></div><div class="field"><label>XP Reward</label><input id="f_xp" type="number" value="${r.xp_reward||0}"></div><div class="field full"><label>Deskripsi</label><textarea id="f_desc">${esc(r.description)}</textarea></div><div class="field full"><label>Content</label><textarea id="f_content">${esc(r.content)}</textarea></div><div class="field full"><label><input id="f_pub" type="checkbox" ${r.published?'checked':''}> Publish</label></div></div><div class="actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveMaterial('${r.id||''}')">Simpan</button></div>`)}
function previewCover(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){toast('Cover harus JPG, PNG, atau WebP');e.target.value='';return}if(f.size>5*1024*1024){toast('File asli terlalu besar. Pilih gambar di bawah 5 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{document.getElementById('coverPreview').innerHTML=`<img src="${r.result}" style="width:100%;max-height:220px;object-fit:cover;border-radius:14px;border:1px solid var(--line)">`};r.readAsDataURL(f)}
async function compressCover(file){const bmp=await createImageBitmap(file);const maxW=1200,maxH=675;const scale=Math.min(1,maxW/bmp.width,maxH/bmp.height);const w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);let blob=await new Promise(res=>c.toBlob(res,'image/webp',.78));if(!blob)throw new Error('Browser tidak mendukung kompresi WebP');if(blob.size>1024*1024){blob=await new Promise(res=>c.toBlob(res,'image/webp',.62))}if(blob.size>1024*1024)throw new Error('Cover masih lebih dari 1 MB setelah kompresi. Pilih gambar yang lebih sederhana.');return blob}
async function uploadMaterialCover(materialId,file,oldPath){const blob=await compressCover(file);const path=`${materialId}/cover.webp`;const {error}=await db.storage.from('material-covers').upload(path,blob,{contentType:'image/webp',upsert:true,cacheControl:'31536000'});if(error)throw error;if(oldPath&&oldPath!==path)await db.storage.from('material-covers').remove([oldPath]);const {error:e2}=await db.from('materials').update({cover_path:path}).eq('id',materialId);if(e2)throw e2;return path}
async function editMaterial(id){const {data,error}=await db.from('materials').select('*').eq('id',id).single();if(error){toast(error.message);return}materialForm(data)}
async function saveMaterial(id){const obj={title:f_title.value.trim(),category:f_category.value.trim(),level:f_level.value.trim(),duration_minutes:+f_duration.value||0,xp_reward:+f_xp.value||0,description:f_desc.value,content:f_content.value,published:f_pub.checked,created_by:me.id};let materialId=id;let oldPath='';if(id){const {data:old}=await db.from('materials').select('cover_path').eq('id',id).single();oldPath=old?.cover_path||'';const {error}=await db.from('materials').update(obj).eq('id',id);if(error){toast(error.message);return}}else{materialId=crypto.randomUUID();obj.id=materialId;const {error}=await db.from('materials').insert(obj);if(error){toast(error.message);return}}try{const file=f_cover.files&&f_cover.files[0];if(file){await uploadMaterialCover(materialId,file,oldPath)}}catch(e){if(!id)await db.from('materials').delete().eq('id',materialId);toast('Cover gagal diupload: '+e.message);return}closeModal();toast('Material tersimpan');adminMaterials()}
async function deleteMaterial(id){if(!confirm('Hapus material ini?'))return;const {data}=await db.from('materials').select('cover_path').eq('id',id).single();const {error}=await db.from('materials').delete().eq('id',id);if(error){toast(error.message);return}if(data?.cover_path)await db.storage.from('material-covers').remove([data.cover_path]);toast('Material dihapus');adminMaterials()}

let quizDraft={id:'',meta:{},questions:[]};
async function adminQuizzes(){const {data,error}=await db.from('quizzes').select('*').order('created_at',{ascending:false});if(error){document.getElementById('adminContent').innerHTML='<div class="card">Gagal memuat Quizzes: '+esc(error.message)+'</div>';return}document.getElementById('adminContent').innerHTML=toolbar('Quizzes','quizForm()')+`<div class="card" style="margin-bottom:12px"><b>Quiz Builder</b><div class="muted">Buat soal, pilihan jawaban, jawaban benar, dan penjelasan langsung dari Android. Data disimpan ke tabel quizzes, questions, dan answers.</div></div>`+rows(data,[['title','Title'],['passing_grade','Passing'],['time_limit_minutes','Menit'],['max_attempt','Attempt'],['published','Published'],['xp_reward','XP']],'editQuiz','deleteQuiz')}
async function editQuiz(id){const [{data:q,error:qe},{data:qs,error:qse}]=await Promise.all([db.from('quizzes').select('*').eq('id',id).single(),db.from('questions').select('*').eq('quiz_id',id).order('question_order')]);if(qe||qse){toast((qe||qse).message);return}let questions=[];for(const x of (qs||[])){const {data:ans,error:ae}=await db.from('answers').select('*').eq('question_id',x.id).order('answer_order');if(ae){toast(ae.message);return}questions.push({id:x.id,question:x.question,type:x.type||'single',explanation:x.explanation||'',answers:(ans||[]).map(a=>({id:a.id,answer:a.answer,correct:!!a.correct}))})}quizDraft={id,meta:q,questions};renderQuizBuilder()}
function quizForm(r={}){quizDraft={id:r.id||'',meta:{...r},questions:[]};renderQuizBuilder()}
function renderQuizBuilder(){const r=quizDraft.meta||{};const qs=quizDraft.questions||[];openModal(r.id?'Edit Kuis':'Tambah Kuis',`<div class="formGrid"><div class="field full"><label>Judul Kuis</label><input id="q_title" value="${esc(r.title)}"></div><div class="field full"><label>Deskripsi</label><textarea id="q_desc">${esc(r.description)}</textarea></div><div class="field"><label>Nilai minimum lulus (%)</label><input id="q_pass" type="number" min="0" max="100" value="${r.passing_grade??70}"></div><div class="field"><label>Time Limit (menit)</label><input id="q_time" type="number" min="0" value="${r.time_limit_minutes||0}"></div><div class="field"><label>Max Attempt</label><input id="q_attempt" type="number" min="1" value="${r.max_attempt||1}"></div><div class="field"><label>XP Reward</label><input id="q_xp" type="number" min="0" value="${r.xp_reward||0}"></div><div class="field full"><label><input id="q_pub" type="checkbox" ${r.published?'checked':''}> Publish</label></div></div><div class="builderBar"><span class="builderCount">Daftar soal · ${qs.length}</span><button class="btn primary" onclick="addQuizQuestion()">＋ Soal</button></div><div id="quizQuestions">${qs.map((q,i)=>quizQuestionHTML(q,i)).join('')}</div><div class="builderHint">Setiap soal minimal memiliki 2 opsi. Untuk pilihan ganda, tandai satu jawaban benar. Penjelasan disimpan bersama soal.</div><div class="actions stickyActions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveQuizBuilder()">Simpan Kuis</button></div>`)}
function quizQuestionHTML(q,i){const type=q.type||'single';if(type==='true_false'&&q.answers.length!==2)q.answers=[{answer:'Benar',correct:false},{answer:'Salah',correct:false}];return `<div class="builderCard"><div class="builderHead"><div><div class="builderLabel">SOAL ${i+1}</div></div><div class="iconBtns"><button class="iconBtn" title="Naik" onclick="moveQuizQuestion(${i},-1)">↑</button><button class="iconBtn" title="Turun" onclick="moveQuizQuestion(${i},1)">↓</button><button class="iconBtn" title="Hapus" onclick="removeQuizQuestion(${i})">🗑</button></div></div><div class="field"><label>Pertanyaan</label><textarea id="qq_${i}">${esc(q.question)}</textarea></div><div class="field"><label>Tipe</label><select id="qt_${i}" onchange="changeQuestionType(${i},this.value)"><option value="single" ${type==='single'?'selected':''}>Pilihan ganda</option><option value="multiple" ${type==='multiple'?'selected':''}>Multiple choice</option><option value="true_false" ${type==='true_false'?'selected':''}>Benar / Salah</option></select></div><div class="field"><label>Pilihan jawaban · tandai jawaban benar</label><div id="opts_${i}">${q.answers.map((a,j)=>`<div class="optionRow"><input class="radioPick" type="${type==='multiple'?'checkbox':'radio'}" name="correct_${i}" ${a.correct?'checked':''} onchange="toggleAnswer(${i},${j},this.checked)"><input id="qa_${i}_${j}" value="${esc(a.answer)}" oninput="quizDraft.questions[${i}].answers[${j}].answer=this.value"><button class="iconBtn" onclick="removeQuizAnswer(${i},${j})" ${type==='true_false'?'disabled':''}>×</button></div>`).join('')}</div>${type!=='true_false'?`<button class="btn small" style="margin-top:9px" onclick="addQuizAnswer(${i})">＋ Tambah opsi</button>`:''}</div><div class="field"><label>Penjelasan jawaban</label><textarea id="qe_${i}" placeholder="Jelaskan alasan jawaban yang benar.">${esc(q.explanation)}</textarea></div></div>`}
function syncQuizFields(){const qs=quizDraft.questions||[];qs.forEach((q,i)=>{const el=document.getElementById('qq_'+i),ex=document.getElementById('qe_'+i);if(el)q.question=el.value;if(ex)q.explanation=ex.value;const typ=document.getElementById('qt_'+i);if(typ)q.type=typ.value;q.answers.forEach((a,j)=>{const x=document.getElementById(`qa_${i}_${j}`);if(x)a.answer=x.value})})}
function addQuizQuestion(){syncQuizFields();quizDraft.questions.push({id:'',question:'',type:'single',explanation:'',answers:[{id:'',answer:'',correct:false},{id:'',answer:'',correct:false},{id:'',answer:'',correct:false},{id:'',answer:'',correct:false}]});renderQuizBuilder()}
function removeQuizQuestion(i){syncQuizFields();quizDraft.questions.splice(i,1);renderQuizBuilder()}
function moveQuizQuestion(i,d){syncQuizFields();const n=i+d;if(n<0||n>=quizDraft.questions.length)return;[quizDraft.questions[i],quizDraft.questions[n]]=[quizDraft.questions[n],quizDraft.questions[i]];renderQuizBuilder()}
function changeQuestionType(i,type){syncQuizFields();const q=quizDraft.questions[i];q.type=type;if(type==='true_false')q.answers=[{id:'',answer:'Benar',correct:false},{id:'',answer:'Salah',correct:false}];else if(q.answers.length<2)q.answers=[{id:'',answer:'',correct:false},{id:'',answer:'',correct:false}];renderQuizBuilder()}
function addQuizAnswer(i){syncQuizFields();quizDraft.questions[i].answers.push({id:'',answer:'',correct:false});renderQuizBuilder()}
function removeQuizAnswer(i,j){syncQuizFields();const q=quizDraft.questions[i];if(q.answers.length<=2){toast('Minimal 2 opsi');return}q.answers.splice(j,1);renderQuizBuilder()}
function toggleAnswer(i,j,checked){syncQuizFields();const q=quizDraft.questions[i];if(q.type==='multiple')q.answers[j].correct=checked;else q.answers.forEach((a,k)=>a.correct=k===j?checked:false);renderQuizBuilder()}
async function saveQuizBuilder(){syncQuizFields();const title=document.getElementById('q_title').value.trim();if(!title){toast('Judul kuis wajib diisi');return}for(let i=0;i<quizDraft.questions.length;i++){const q=quizDraft.questions[i];q.question=q.question.trim();q.answers=q.answers.map(a=>({...a,answer:String(a.answer||'').trim()}));if(!q.question){toast('Pertanyaan soal '+(i+1)+' masih kosong');return}if(q.answers.length<2||q.answers.some(a=>!a.answer)){toast('Opsi soal '+(i+1)+' belum lengkap');return}const correct=q.answers.filter(a=>a.correct).length;if(q.type==='single'&&correct!==1){toast('Soal '+(i+1)+' harus memiliki tepat 1 jawaban benar');return}if(q.type==='multiple'&&correct<1){toast('Soal '+(i+1)+' harus memiliki minimal 1 jawaban benar');return}if(q.type==='true_false'&&correct!==1){toast('Soal '+(i+1)+' harus memiliki 1 jawaban benar');return}}
 const obj={title,passing_grade:+document.getElementById('q_pass').value||70,time_limit_minutes:+document.getElementById('q_time').value||0,max_attempt:+document.getElementById('q_attempt').value||1,xp_reward:+document.getElementById('q_xp').value||0,description:document.getElementById('q_desc').value,published:document.getElementById('q_pub').checked,created_by:me.id};let quizId=quizDraft.id;if(quizId){const {error}=await db.from('quizzes').update(obj).eq('id',quizId);if(error){toast(error.message);return};const {data:oldQs}=await db.from('questions').select('id').eq('quiz_id',quizId);if(oldQs?.length){const {error:e}=await db.from('questions').delete().eq('quiz_id',quizId);if(e){toast(e.message);return}}}else{quizId=crypto.randomUUID();obj.id=quizId;const {error}=await db.from('quizzes').insert(obj);if(error){toast(error.message);return}}
 for(let i=0;i<quizDraft.questions.length;i++){const q=quizDraft.questions[i];const qid=crypto.randomUUID();const {error:qe}=await db.from('questions').insert({id:qid,quiz_id:quizId,question:q.question,type:q.type,question_order:i+1,explanation:q.explanation});if(qe){toast('Gagal menyimpan soal '+(i+1)+': '+qe.message);return}const answers=q.answers.map((a,j)=>({id:crypto.randomUUID(),question_id:qid,answer:a.answer,correct:!!a.correct,answer_order:j+1}));const {error:ae}=await db.from('answers').insert(answers);if(ae){toast('Gagal menyimpan opsi soal '+(i+1)+': '+ae.message);return}}
 closeModal();toast('Kuis dan soal berhasil disimpan');adminQuizzes()}
async function deleteQuiz(id){if(!confirm('Hapus kuis dan semua pertanyaannya?'))return;const {error}=await db.from('quizzes').delete().eq('id',id);toast(error?error.message:'Kuis dihapus');adminQuizzes()}

async function saveNotification(id){const obj={recipient_user_id:n_rec.value.trim()||null,title:n_title.value.trim(),message:n_msg.value,type:n_type.value,sent_at:new Date().toISOString()};const {error}=id?await db.from('notifications').update(obj).eq('id',id):await db.from('notifications').insert(obj);if(error){toast(error.message);return}closeModal();toast('Notification tersimpan');adminNotifications()}
async function deleteNotification(id){if(!confirm('Hapus notification?'))return;const {error}=await db.from('notifications').delete().eq('id',id);toast(error?error.message:'Notification dihapus');adminNotifications()}

async function notifications(){if(!me)return;const {data}=await db.from('notifications').select('*').eq('recipient_user_id',me.id).order('created_at',{ascending:false}).limit(20);openModal('Notifications',(data||[]).map(n=>`<div class="card" style="margin-top:10px"><b>${esc(n.title)}</b><div class="muted">${esc(n.message)}</div></div>`).join('')||'<div class="empty">Belum ada notifikasi.</div>')}
async function logout(){await db.auth.signOut();location.reload()}
db.auth.getSession().then(({data})=>{if(data.session)boot(data.session.user)});
</script>
</body></html>
